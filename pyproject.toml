[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safegate-360-reference"
version = "0.3.0"
description = "Offline reference implementation of policy-driven text guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Didier Lioniello" }]
dependencies = ["click>=8.1,<9"]

[project.scripts]
safegate-reference = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "detectors*", "examples*", "policies*"]

[tool.setuptools.package-data]
examples = ["probes.jsonl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
